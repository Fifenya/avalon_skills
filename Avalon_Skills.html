<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avalon | Skill Tree</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', 'Segoe UI', serif;
            background: #0a0f1a;
            color: #e8dcc8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1a2e 50%, #0d1117 100%);
        }

        .bg-layer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(100, 70, 200, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200, 100, 150, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 16px;
            padding-bottom: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, rgba(30, 25, 55, 0.9), rgba(20, 15, 40, 0.95));
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(210, 180, 140, 0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .diploma-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .diploma-red {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #ffd700;
            box-shadow: 0 0 15px rgba(220,38,38,0.3);
        }

        .diploma-blue {
            background: linear-gradient(135deg, #3b82f6, #1e3a5f);
            color: #e0e0e0;
        }

        .diploma-none {
            background: linear-gradient(135deg, #4b5563, #374151);
            color: #9ca3af;
        }

        .faculty-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
        }

        .faculty-water { background: linear-gradient(135deg, #2563eb, #1e3a5f); color: #93c5fd; }
        .faculty-earth { background: linear-gradient(135deg, #16a34a, #14532d); color: #86efac; }
        .faculty-fire { background: linear-gradient(135deg, #ea580c, #7c2d12); color: #fdba74; }
        .faculty-lightning { background: linear-gradient(135deg, #9333ea, #4c1d95); color: #d8b4fe; }

        .points {
            font-size: 44px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,215,0,0.3);
            margin: 8px 0;
        }

        .points-label {
            font-size: 12px;
            color: #b8a88c;
            letter-spacing: 2px;
        }

        .no-diploma-warning {
            background: linear-gradient(135deg, rgba(220,38,38,0.2), rgba(0,0,0,0.6));
            border: 1px solid #ef4444;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .no-diploma-warning h3 {
            color: #ef4444;
            margin-bottom: 12px;
        }

        .no-diploma-warning p {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 16px;
        }

        .no-diploma-warning button {
            background: linear-gradient(135deg, #4a2f8d, #2a1a5e);
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            color: #ffd700;
            font-weight: bold;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: thin;
        }

        .tab {
            flex-shrink: 0;
            padding: 10px 18px;
            background: rgba(25, 20, 45, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid rgba(210, 180, 140, 0.3);
        }

        .tab.active {
            background: linear-gradient(135deg, #4a2f8d, #2a1a5e);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(74,47,141,0.5);
        }

        .tab.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tree-container {
            background: rgba(15, 12, 25, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 20px 12px;
            border: 1px solid rgba(210, 180, 140, 0.2);
        }

        .skill-tree {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .skill-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .skill-node {
            background: rgba(10, 8, 20, 0.9);
            border-radius: 20px;
            padding: 14px;
            width: 170px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid rgba(210, 180, 140, 0.3);
        }

        .skill-node.learned {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05));
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
        }

        .skill-node.available {
            border-color: #22c55e;
            animation: pulse 1.5s infinite;
        }

        .skill-node.locked {
            border-color: #ef4444;
            opacity: 0.7;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
        }

        .skill-emoji {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .skill-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .skill-desc {
            font-size: 10px;
            opacity: 0.7;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .skill-cost {
            font-size: 11px;
            color: #f59e0b;
        }

        .connector {
            text-align: center;
            font-size: 20px;
            color: rgba(210, 180, 140, 0.4);
            margin: -8px 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1528, #0f0c1a);
            border-radius: 32px;
            max-width: 320px;
            width: 100%;
            padding: 24px;
            border: 1px solid rgba(210, 180, 140, 0.5);
            position: relative;
        }

        .modal-emoji {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 14px;
            text-align: center;
            opacity: 0.8;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(210, 180, 140, 0.2);
        }

        .requirement-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(210, 180, 140, 0.1);
        }

        .requirement-label {
            font-size: 14px;
        }

        .requirement-value.met {
            color: #22c55e;
        }

        .requirement-value.not-met {
            color: #ef4444;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a2f8d, #2a1a5e);
            color: #ffd700;
        }

        .btn-primary.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #b8a88c;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.6;
            color: white;
            background: none;
            border: none;
        }

        .branch-info {
            background: rgba(15, 12, 25, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid rgba(210, 180, 140, 0.2);
            text-align: center;
        }

        .branch-status {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .branch-progress {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .branch-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffb347);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }

        .branch-message {
            font-size: 13px;
            color: #b8a88c;
            margin-top: 8px;
        }

        .close-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74, 47, 141, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(210, 180, 140, 0.3);
            border-radius: 40px;
            padding: 12px 24px;
            color: #ffd700;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .skill-node {
                width: 145px;
                padding: 10px;
            }
            .skill-emoji {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    
    <div id="app" class="container"></div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalInner"></div>
        </div>
    </div>

    <div class="close-btn" onclick="closeApp()">✕ Закрыть</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function closeApp() {
            tg.close();
        }

        // ========== ДАННЫЕ ИГРОКА (приходят из бота) ==========
        let playerData = {
            has_diploma: true,           // ЕСТЬ ЛИ ДИПЛОМ? (true/false)
            diploma_type: 'red',          // 'red' или 'blue' (если есть диплом)
            faculty: 'fire',              // 'water', 'earth', 'fire', 'lightning'
            prestige_points: 7,
            level: 15,
            branches: {}
        };

        let currentBranchId = null;
        let selectedSkill = null;

        // ========== ДАННЫЕ ВЕТОК ПО ФАКУЛЬТЕТАМ ==========
        const FACULTY_BRANCHES = {
            water: {
                name: '💧 Вода',
                branches: [
                    {
                        id: 'pure_water',
                        name: 'Чистая вода',
                        emoji: '💧',
                        description: 'Исцеление и поддержка',
                        max_level: 5,
                        is_unlocked_by_red: true,
                        levels: [
                            { level: 1, name: 'Целительная капля', desc: 'Восстанавливает здоровье', cost: 1, effects: { hp_regen: 5, healing_power: 10 }, req_level: 1, req_branch: 0 },
                            { level: 2, name: 'Водяной щит', desc: 'Увеличивает защиту', cost: 2, effects: { armor: 8, magic_resist: 5 }, req_level: 5, req_branch: 1 },
                            { level: 3, name: 'Поток исцеления', desc: 'Мощное лечение', cost: 2, effects: { healing_power: 25, mana_regen: 3 }, req_level: 10, req_branch: 2 },
                            { level: 4, name: 'Океанская благодать', desc: 'Лечит всю группу', cost: 3, effects: { party_heal: 30, hp: 100 }, req_level: 15, req_branch: 3 },
                            { level: 5, name: 'Владыка вод', desc: 'Верховный целитель', cost: 5, effects: { healing_power: 50, hp: 200, mana: 100 }, req_level: 20, req_branch: 4 }
                        ]
                    },
                    {
                        id: 'ice',
                        name: 'Лёд',
                        emoji: '❄️',
                        description: 'Контроль и заморозка',
                        max_level: 5,
                        is_unlocked_by_red: false,
                        levels: [
                            { level: 1, name: 'Мороз', desc: 'Замедляет врага', cost: 1, effects: { slow: 20, spell_damage: 5 }, req_level: 3, req_branch: 0 },
                            { level: 2, name: 'Ледяная стрела', desc: 'Пробивающая атака', cost: 2, effects: { spell_damage: 15, crit: 0.03 }, req_level: 8, req_branch: 1 },
                            { level: 3, name: 'Ледяная стена', desc: 'Блокирует урон', cost: 2, effects: { armor: 15, block: 0.08 }, req_level: 12, req_branch: 2 },
                            { level: 4, name: 'Вечная мерзлота', desc: 'Шанс заморозки', cost: 3, effects: { freeze_chance: 0.15, spell_damage: 20 }, req_level: 16, req_branch: 3 },
                            { level: 5, name: 'Король льда', desc: 'Абсолютный контроль', cost: 5, effects: { freeze_chance: 0.25, spell_damage: 35, crit: 0.08 }, req_level: 20, req_branch: 4 }
                        ]
                    }
                ]
            },
            earth: {
                name: '🌍 Земля',
                branches: [
                    {
                        id: 'nature',
                        name: 'Природа',
                        emoji: '🌿',
                        description: 'Жизнь и исцеление',
                        max_level: 5,
                        is_unlocked_by_red: true,
                        levels: [
                            { level: 1, name: 'Прорастание', desc: 'Постепенное исцеление', cost: 1, effects: { hp_regen: 8, nature_power: 5 }, req_level: 1, req_branch: 0 },
                            { level: 2, name: 'Корни жизни', desc: 'Восстанавливает HP', cost: 2, effects: { healing_power: 15, hp: 50 }, req_level: 5, req_branch: 1 },
                            { level: 3, name: 'Лечебная роща', desc: 'Лечит всех рядом', cost: 2, effects: { party_regen: 10, mana_regen: 2 }, req_level: 10, req_branch: 2 },
                            { level: 4, name: 'Древо жизни', desc: 'Мощное исцеление', cost: 3, effects: { healing_power: 35, hp: 150 }, req_level: 15, req_branch: 3 },
                            { level: 5, name: 'Хранитель природы', desc: 'Вечная жизнь', cost: 5, effects: { healing_power: 60, hp: 300, revive: true }, req_level: 20, req_branch: 4 }
                        ]
                    },
                    {
                        id: 'earth_element',
                        name: 'Земляной элемент',
                        emoji: '🪨',
                        description: 'Оборона и мощь',
                        max_level: 5,
                        is_unlocked_by_red: false,
                        levels: [
                            { level: 1, name: 'Каменный шип', desc: 'Урон и контроль', cost: 1, effects: { power: 8, armor: 5 }, req_level: 3, req_branch: 0 },
                            { level: 2, name: 'Земляная стена', desc: 'Увеличивает защиту', cost: 2, effects: { armor: 15, block: 0.05 }, req_level: 8, req_branch: 1 },
                            { level: 3, name: 'Каменная броня', desc: 'Поглощает урон', cost: 2, effects: { armor: 25, damage_reduction: 0.1 }, req_level: 12, req_branch: 2 },
                            { level: 4, name: 'Толчок земли', desc: 'Массовое оглушение', cost: 3, effects: { stun_chance: 0.2, power: 15 }, req_level: 16, req_branch: 3 },
                            { level: 5, name: 'Хранитель земли', desc: 'Несокрушимая стена', cost: 5, effects: { armor: 50, hp: 250, block: 0.15 }, req_level: 20, req_branch: 4 }
                        ]
                    }
                ]
            },
            fire: {
                name: '🔥 Огонь',
                branches: [
                    {
                        id: 'pure_fire',
                        name: 'Чистый огонь',
                        emoji: '🔥',
                        description: 'Разрушение и мощь',
                        max_level: 5,
                        is_unlocked_by_red: true,
                        levels: [
                            { level: 1, name: 'Искра', desc: 'Зарождение огня', cost: 1, effects: { power: 5, spell_damage: 5 }, req_level: 1, req_branch: 0 },
                            { level: 2, name: 'Огненный шар', desc: 'Мощный урон', cost: 2, effects: { spell_damage: 15, burn: 5 }, req_level: 5, req_branch: 1 },
                            { level: 3, name: 'Стена огня', desc: 'Облачный урон', cost: 2, effects: { spell_damage: 20, area_damage: 0.3 }, req_level: 10, req_branch: 2 },
                            { level: 4, name: 'Небесный огонь', desc: 'Гигантский урон', cost: 3, effects: { spell_damage: 30, crit: 0.05 }, req_level: 15, req_branch: 3 },
                            { level: 5, name: 'Повелитель огня', desc: 'Абсолютное разрушение', cost: 5, effects: { spell_damage: 50, power: 30, crit: 0.1 }, req_level: 20, req_branch: 4 }
                        ]
                    }
                ]
            },
            lightning: {
                name: '⚡ Электричество',
                branches: [
                    {
                        id: 'pure_lightning',
                        name: 'Чистое электричество',
                        emoji: '⚡',
                        description: 'Скорость и мощь',
                        max_level: 5,
                        is_unlocked_by_red: true,
                        levels: [
                            { level: 1, name: 'Искра', desc: 'Пробуждение', cost: 1, effects: { power: 5, speed: 5 }, req_level: 1, req_branch: 0 },
                            { level: 2, name: 'Электрический разряд', desc: 'Цепная атака', cost: 2, effects: { spell_damage: 15, chain: 2 }, req_level: 5, req_branch: 1 },
                            { level: 3, name: 'Громовой шар', desc: 'Мощный взрыв', cost: 2, effects: { spell_damage: 25, stun: 0.1 }, req_level: 10, req_branch: 2 },
                            { level: 4, name: 'Буря', desc: 'Массовый урон', cost: 3, effects: { spell_damage: 35, attack_speed: 0.2 }, req_level: 15, req_branch: 3 },
                            { level: 5, name: 'Повелитель молний', desc: 'Божественная мощь', cost: 5, effects: { spell_damage: 60, crit: 0.12, chain: 5 }, req_level: 20, req_branch: 4 }
                        ]
                    }
                ]
            }
        };

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            const initData = tg.initDataUnsafe;
            if (initData && initData.user && initData.user.id) {
                // TODO: Запросить данные игрока у бота через tg.sendData
            }
            
            // Демо-данные (в реальном боте заменятся на данные из БД)
            playerData = {
                has_diploma: true,        // ЕСТЬ ЛИ ДИПЛОМ? true/false
                diploma_type: 'red',       // 'red' или 'blue'
                faculty: 'fire',
                prestige_points: 7,
                level: 15,
                branches: {
                    pure_fire: 2,
                    pure_water: 0,
                    ice: 0,
                    nature: 0,
                    earth_element: 0,
                    pure_lightning: 0
                }
            };
            
            const facultyData = FACULTY_BRANCHES[playerData.faculty];
            if (facultyData && facultyData.branches.length > 0) {
                currentBranchId = facultyData.branches[0].id;
            }
            
            renderApp();
        }

        function renderApp() {
            // ===== ГЛАВНАЯ ПРОВЕРКА: ЕСТЬ ЛИ ДИПЛОМ? =====
            if (!playerData.has_diploma) {
                renderNoDiplomaScreen();
                return;
            }
            
            const facultyData = FACULTY_BRANCHES[playerData.faculty];
            const isRed = playerData.diploma_type === 'red';
            
            let html = `
                <div class="header">
                    <div class="diploma-badge ${isRed ? 'diploma-red' : 'diploma-blue'}">
                        ${isRed ? '🔴 КРАСНЫЙ ДИПЛОМ' : '🔵 СИНИЙ ДИПЛОМ'}
                    </div>
                    <div class="faculty-badge faculty-${playerData.faculty}">
                        ${facultyData?.name || '⚡ Неизвестно'}
                    </div>
                    <div class="points">${playerData.prestige_points}</div>
                    <div class="points-label">очков прокачки</div>
                </div>

                <div class="tabs">
                    ${facultyData.branches.map(branch => {
                        // Проверка: нужен ли красный диплом для этой ветки?
                        const needsRed = branch.is_unlocked_by_red === true;
                        const isAvailable = !needsRed || (needsRed && isRed);
                        const isLockedClass = !isAvailable ? 'locked' : '';
                        return `
                            <div class="tab ${currentBranchId === branch.id ? 'active' : ''} ${isLockedClass}" 
                                 onclick="${isAvailable ? `selectBranch('${branch.id}')` : ''}">
                                ${branch.emoji} ${branch.name}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            const currentBranch = facultyData.branches.find(b => b.id === currentBranchId);
            if (currentBranch) {
                html += renderSkillTree(currentBranch);
            }

            document.getElementById('app').innerHTML = html;
        }

        function renderNoDiplomaScreen() {
            const html = `
                <div class="header">
                    <div class="diploma-badge diploma-none">
                        ❌ НЕТ ДИПЛОМА
                    </div>
                </div>
                
                <div class="no-diploma-warning">
                    <h3>🎓 ДИПЛОМ НЕ НАЙДЕН</h3>
                    <p>Для доступа к дереву навыков необходимо получить диплом в Академии Магии.</p>
                    <p>📜 Диплом открывает доступ к прокачке способностей и очкам престижа.</p>
                    <button onclick="closeApp()">🎓 В АКАДЕМИЮ</button>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function renderSkillTree(branch) {
            const currentLevel = playerData.branches[branch.id] || 0;
            const isRed = playerData.diploma_type === 'red';
            const isUnlocked = branch.is_unlocked_by_red ? isRed : true;
            
            const progressPercent = (currentLevel / branch.max_level) * 100;
            
            let statusMessage = '';
            if (!isUnlocked) {
                statusMessage = '🔒 Ветка доступна только с КРАСНЫМ дипломом!';
            } else if (currentLevel >= branch.max_level) {
                statusMessage = '🏆 Ветка полностью изучена!';
            } else {
                const nextLevel = branch.levels.find(l => l.level === currentLevel + 1);
                statusMessage = nextLevel ? `📖 Нажми на "${nextLevel.name}" чтобы изучить` : '';
            }
            
            let treeHtml = `
                <div class="tree-container">
                    <div class="skill-tree">
            `;
            
            for (let i = 0; i < branch.levels.length; i++) {
                const level = branch.levels[i];
                let status = 'locked';
                
                if (level.level <= currentLevel) {
                    status = 'learned';
                } else if (level.level === currentLevel + 1 && isUnlocked) {
                    status = 'available';
                }
                
                treeHtml += `
                    <div class="skill-row">
                        <div class="skill-node ${status}" onclick="openSkillModal('${branch.id}', ${level.level})">
                            <div class="skill-emoji">${status === 'learned' ? '⭐' : (status === 'available' ? '🔓' : '🔒')}</div>
                            <div class="skill-name">${escapeHtml(level.name)}</div>
                            <div class="skill-desc">${escapeHtml(level.desc)}</div>
                            <div class="skill-desc" style="color: #ffd700;">
                                ${Object.entries(level.effects).slice(0, 2).map(([k, v]) => `${formatStatShort(k, v)}`).join(' | ')}
                            </div>
                            ${status !== 'learned' ? `<div class="skill-cost">⚡ ${level.cost} очков</div>` : ''}
                        </div>
                    </div>
                `;
                if (i < branch.levels.length - 1) {
                    treeHtml += `<div class="connector">▼</div>`;
                }
            }
            
            treeHtml += `
                    </div>
                </div>
                
                <div class="branch-info">
                    <div class="branch-status">
                        <span>${branch.emoji} ${escapeHtml(branch.name)}</span>
                        <span>${currentLevel}/${branch.max_level}</span>
                    </div>
                    <div class="branch-progress">
                        <div class="branch-progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                    <div class="branch-message">${statusMessage}</div>
                </div>
            `;
            
            return treeHtml;
        }

        function formatStatShort(stat, value) {
            if (stat === 'crit' || stat === 'dodge' || stat === 'block' || stat === 'freeze_chance' || stat === 'stun_chance') {
                return `${Math.round(value * 100)}%`;
            }
            return `+${value}`;
        }

        function formatStatValue(stat, value) {
            const names = {
                power: 'Сила', hp: 'Здоровье', mana: 'Мана', armor: 'Броня',
                crit: 'Крит шанс', dodge: 'Уворот', block: 'Блок',
                spell_damage: 'Урон заклинаний', mana_regen: 'Реген маны',
                hp_regen: 'Реген HP', healing_power: 'Сила лечения',
                party_heal: 'Групповое лечение', party_regen: 'Групповая регенерация',
                burn: 'Горение', freeze_chance: 'Заморозка', stun_chance: 'Оглушение',
                chain: 'Цепь', area_damage: 'Облачный урон', revive: 'Воскрешение',
                damage_reduction: 'Снижение урона', slow: 'Замедление', speed: 'Скорость',
                attack_speed: 'Скорость атаки', magic_resist: 'Сопротивление магии',
                nature_power: 'Сила природы'
            };
            const icons = {
                power: '⚔️', hp: '❤️', mana: '💙', armor: '🛡️',
                crit: '💥', dodge: '💨', block: '🛡️', spell_damage: '✨',
                healing_power: '💚', party_heal: '👥', party_regen: '👥',
                burn: '🔥', freeze_chance: '❄️', stun_chance: '⚡',
                chain: '⛓️', area_damage: '🌊', revive: '🌱',
                damage_reduction: '🛡️', slow: '🐢', speed: '💨',
                hp_regen: '❤️', mana_regen: '💙'
            };
            const icon = icons[stat] || '📊';
            const name = names[stat] || stat;
            
            if (stat === 'crit' || stat === 'dodge' || stat === 'block' || stat === 'freeze_chance' || stat === 'stun_chance') {
                return `${icon} ${name}: +${Math.round(value * 100)}%`;
            }
            if (stat === 'revive') return `${icon} ${name}: +${value ? 'Да' : 'Нет'}`;
            return `${icon} ${name}: +${value}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function selectBranch(branchId) {
            currentBranchId = branchId;
            renderApp();
        }

        function openSkillModal(branchId, levelNum) {
            const facultyData = FACULTY_BRANCHES[playerData.faculty];
            const branch = facultyData.branches.find(b => b.id === branchId);
            if (!branch) return;
            
            const skill = branch.levels.find(l => l.level === levelNum);
            if (!skill) return;
            
            const currentLevel = playerData.branches[branch.id] || 0;
            const isRed = playerData.diploma_type === 'red';
            const isUnlocked = branch.is_unlocked_by_red ? isRed : true;
            
            let canLearn = false;
            if (isUnlocked && skill.level === currentLevel + 1 && playerData.prestige_points >= skill.cost && playerData.level >= skill.req_level) {
                canLearn = true;
            }
            
            const levelMet = playerData.level >= skill.req_level;
            const branchMet = currentLevel >= skill.req_branch;
            const pointsMet = playerData.prestige_points >= skill.cost;
            
            const modalHtml = `
                <div class="modal-emoji">${skill.level <= currentLevel ? '⭐' : (canLearn ? '🔓' : '🔒')}</div>
                <div class="modal-title">${escapeHtml(skill.name)}</div>
                <div class="modal-desc">${escapeHtml(skill.desc)}</div>
                
                <div class="requirement-item">
                    <span class="requirement-label">📊 Уровень героя</span>
                    <span class="requirement-value ${levelMet ? 'met' : 'not-met'}">
                        ${playerData.level}/${skill.req_level}
                    </span>
                </div>
                
                <div class="requirement-item">
                    <span class="requirement-label">🎓 Уровень ветки</span>
                    <span class="requirement-value ${branchMet ? 'met' : 'not-met'}">
                        ${currentLevel}/${skill.req_branch}
                    </span>
                </div>
                
                <div class="requirement-item">
                    <span class="requirement-label">✨ Требуемые очки</span>
                    <span class="requirement-value ${pointsMet ? 'met' : 'not-met'}">
                        ${playerData.prestige_points}/${skill.cost}
                    </span>
                </div>
                
                ${Object.keys(skill.effects).length > 0 ? `
                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(210,180,140,0.2);">
                    <div style="font-size: 12px; opacity: 0.7; margin-bottom: 8px;">📜 НАГРАДА ЗА ИЗУЧЕНИЕ</div>
                    ${Object.entries(skill.effects).map(([stat, value]) => `
                        <div class="requirement-item">
                            <span class="requirement-label">${formatStatValue(stat, value).split(':')[0]}</span>
                            <span class="requirement-value met">${formatStatValue(stat, value).split(':')[1]}</span>
                        </div>
                    `).join('')}
                </div>
                ` : ''}
                
                <div class="modal-buttons">
                    ${canLearn ? `<button class="btn btn-primary" onclick="learnSkill('${branch.id}', ${skill.level}, ${skill.cost})">Изучить (${skill.cost})</button>` : 
                      skill.level <= currentLevel ? `<button class="btn btn-primary disabled" disabled>✅ Изучено</button>` :
                      `<button class="btn btn-primary disabled" disabled>🔒 Недоступно</button>`}
                    <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
                </div>
            `;
            
            selectedSkill = { branchId, level: skill.level, cost: skill.cost };
            document.getElementById('modalInner').innerHTML = modalHtml;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            selectedSkill = null;
        }

        function learnSkill(branchId, level, cost) {
            if (playerData.prestige_points < cost) {
                tg.showPopup({
                    title: '❌ Ошибка',
                    message: `Нужно ${cost} очков прокачки!`,
                    buttons: [{type: 'ok'}]
                });
                return;
            }
            
            playerData.prestige_points -= cost;
            playerData.branches[branchId] = level;
            
            renderApp();
            closeModal();
            
            tg.showPopup({
                title: '✨ Успех',
                message: `Навык изучен!`,
                buttons: [{type: 'ok'}]
            });
            
            // Отправляем данные в бот
            tg.sendData(JSON.stringify({
                action: 'upgrade_skill',
                branch: branchId,
                level: level
            }));
        }

        init();
    </script>
</body>
</html>
