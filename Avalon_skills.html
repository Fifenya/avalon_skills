<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Elemental Skills | Avalon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', 'Segoe UI', serif;
            background: #0a0f1a;
            color: #e8dcc8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимация загрузки */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1a2e 50%, #0d1117 100%);
        }

        .bg-layer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(100, 70, 200, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200, 100, 150, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .bg-layer::after {
            content: '✦ ⚔️ 🛡️ 🔮 ✨ 🐉 ⚡ ❄️ 🔥 💧 🌿 🪨';
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 24px;
            opacity: 0.05;
            letter-spacing: 20px;
            white-space: nowrap;
            overflow-x: hidden;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 16px;
            padding-bottom: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, rgba(30, 25, 55, 0.9), rgba(20, 15, 40, 0.95));
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(210, 180, 140, 0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .diploma-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .diploma-red {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #ffd700;
            box-shadow: 0 0 15px rgba(220,38,38,0.3);
        }

        .diploma-blue {
            background: linear-gradient(135deg, #3b82f6, #1e3a5f);
            color: #e0e0e0;
        }

        .diploma-none {
            background: linear-gradient(135deg, #4a4a6a, #2a2a4a);
            color: #b8a88c;
        }

        .points {
            font-size: 44px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,215,0,0.3);
            margin: 8px 0;
        }

        .points-label {
            font-size: 12px;
            color: #b8a88c;
            letter-spacing: 2px;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(210, 180, 140, 0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin: 20px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: thin;
        }

        .tab {
            flex-shrink: 0;
            padding: 10px 18px;
            background: rgba(25, 20, 45, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid rgba(210, 180, 140, 0.3);
        }

        .tab.active {
            background: linear-gradient(135deg, #4a2f8d, #2a1a5e);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(74,47,141,0.5);
        }

        .tree-container {
            background: rgba(15, 12, 25, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 20px 12px;
            border: 1px solid rgba(210, 180, 140, 0.2);
        }

        .skill-tree {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .skill-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .skill-node {
            background: rgba(10, 8, 20, 0.9);
            border-radius: 20px;
            padding: 14px;
            width: 170px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid rgba(210, 180, 140, 0.3);
        }

        .skill-node.learned {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05));
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
        }

        .skill-node.available {
            border-color: #22c55e;
            animation: pulse 1.5s infinite;
        }

        .skill-node.locked {
            border-color: #ef4444;
            opacity: 0.7;
        }

        .skill-emoji {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .skill-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .skill-desc {
            font-size: 10px;
            opacity: 0.7;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .skill-cost {
            font-size: 11px;
            color: #f59e0b;
        }

        .connector {
            text-align: center;
            font-size: 20px;
            color: rgba(210, 180, 140, 0.4);
            margin: -8px 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1528, #0f0c1a);
            border-radius: 32px;
            max-width: 320px;
            width: 100%;
            padding: 24px;
            border: 1px solid rgba(210, 180, 140, 0.5);
            position: relative;
        }

        .modal-emoji {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 14px;
            text-align: center;
            opacity: 0.8;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(210, 180, 140, 0.2);
        }

        .requirement-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(210, 180, 140, 0.1);
        }

        .requirement-label {
            font-size: 14px;
        }

        .requirement-value.met {
            color: #22c55e;
        }

        .requirement-value.not-met {
            color: #ef4444;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a2f8d, #2a1a5e);
            color: #ffd700;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #b8a88c;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.6;
            color: white;
            background: none;
            border: none;
        }

        .branch-info {
            background: rgba(15, 12, 25, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid rgba(210, 180, 140, 0.2);
            text-align: center;
        }

        .branch-status {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .branch-progress {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .branch-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffb347);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }

        .branch-message {
            font-size: 13px;
            color: #b8a88c;
            margin-top: 8px;
        }

        .close-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74, 47, 141, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(210, 180, 140, 0.3);
            border-radius: 40px;
            padding: 12px 24px;
            color: #ffd700;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
        }

        .close-btn:active {
            transform: translateX(-50%) scale(0.97);
        }

        .retry-btn {
            background: #4a2f8d;
            border: none;
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            .skill-node {
                width: 145px;
                padding: 10px;
            }
            .skill-emoji {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    
    <div id="app" class="container">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div>Загрузка Древа Навыков...</div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 8px;">Авалон приветствует героя</div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalInner"></div>
        </div>
    </div>

    <div class="close-btn" onclick="closeApp()">✕ Закрыть</div>

    <script>
        // ========== ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP ==========
        let tg;
        let isTelegram = false;
        
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                isTelegram = true;
                console.log('✅ Telegram WebApp инициализирован');
            } else {
                console.warn('⚠️ Не в Telegram окружении');
                tg = {
                    ready: () => {},
                    expand: () => {},
                    close: () => window.close(),
                    showPopup: (options) => alert(options.message),
                    sendData: (data) => console.log('Telegram sendData:', data),
                    initDataUnsafe: { user: { id: 'test_user' } }
                };
            }
        } catch(e) {
            console.error('Ошибка инициализации:', e);
            tg = {
                ready: () => {},
                expand: () => {},
                close: () => window.close(),
                showPopup: (options) => alert(options.message),
                sendData: (data) => console.log('Telegram sendData:', data),
                initDataUnsafe: { user: { id: 'test_user' } }
            };
        }
        
        function closeApp() {
            tg.close();
        }

        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        let currentData = null;
        let currentBranch = null;
        let selectedSkill = null;
        let isLoading = false;

        // ========== ОТПРАВКА ЗАПРОСОВ К БОТУ ==========
        function sendToBot(action, extra = {}) {
            if (isLoading) return;
            
            const message = JSON.stringify({
                action: action,
                ...extra
            });
            
            console.log('📤 Отправка боту:', message);
            
            try {
                tg.sendData(message);
            } catch(e) {
                console.error('Ошибка отправки:', e);
                showError('Не удалось отправить запрос боту');
            }
        }

        // ========== ПОКАЗ ОШИБКИ ==========
        function showError(message) {
            const appDiv = document.getElementById('app');
            if (appDiv) {
                appDiv.innerHTML = `
                    <div class="error-message">
                        <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                        <div style="font-weight: bold; margin-bottom: 8px;">Ошибка</div>
                        <div style="font-size: 14px;">${message}</div>
                        <button class="retry-btn" onclick="loadDataFromBot()">🔄 Повторить</button>
                    </div>
                `;
            }
        }

        // ========== ЗАГРУЗКА ДАННЫХ ОТ БОТА ==========
        function loadDataFromBot() {
            if (isLoading) return;
            isLoading = true;
            
            renderLoading();
            sendToBot('get_prestige_data');
            
            // Таймаут на случай если бот не ответит
            setTimeout(() => {
                if (isLoading && !currentData) {
                    isLoading = false;
                    showError('Бот не отвечает. Проверь соединение.');
                }
            }, 10000);
        }

        // ========== ОБРАБОТЧИК ОТВЕТОВ ОТ БОТА ==========
        window.handleBotResponse = function(data) {
            console.log('📥 Ответ от бота:', data);
            isLoading = false;
            
            if (data.type === 'prestige_data') {
                currentData = data;
                if (currentData.branches && currentData.branches.length > 0) {
                    currentBranch = currentData.branches[0];
                }
                renderApp();
            } 
            else if (data.type === 'upgrade_success') {
                tg.showPopup({
                    title: '✨ Успех',
                    message: data.message,
                    buttons: [{type: 'ok'}]
                });
                loadDataFromBot();
            } 
            else if (data.type === 'upgrade_error') {
                tg.showPopup({
                    title: '❌ Ошибка',
                    message: data.message,
                    buttons: [{type: 'ok'}]
                });
            }
            else if (data.type === 'unlock_success') {
                tg.showPopup({
                    title: '🔓 Успех',
                    message: data.message,
                    buttons: [{type: 'ok'}]
                });
                loadDataFromBot();
            }
            else if (data.type === 'unlock_error') {
                tg.showPopup({
                    title: '❌ Ошибка',
                    message: data.message,
                    buttons: [{type: 'ok'}]
                });
            }
            else if (data.type === 'error') {
                showError(data.message);
            }
        };

        // ========== ОТОБРАЖЕНИЕ ЗАГРУЗКИ ==========
        function renderLoading() {
            const appDiv = document.getElementById('app');
            if (appDiv) {
                appDiv.innerHTML = `
                    <div class="header">
                        <div class="points">Загрузка...</div>
                        <div class="points-label">Подключение к Авалону</div>
                    </div>
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <div>Получаем данные о прокачке...</div>
                        <div style="font-size: 12px; opacity: 0.7; margin-top: 8px;">Это может занять несколько секунд</div>
                    </div>
                `;
            }
        }

        // ========== ОСНОВНАЯ ОТРИСОВКА ==========
        function renderApp() {
            if (!currentData) {
                renderLoading();
                return;
            }
            
            if (currentData.error) {
                showError(currentData.error);
                return;
            }
            
            const { diploma_type, prestige_points, branches } = currentData;
            
            let diplomaClass = 'diploma-none';
            let diplomaText = '🎓 БЕЗ ДИПЛОМА';
            if (diploma_type === 'red') {
                diplomaClass = 'diploma-red';
                diplomaText = '🔴 КРАСНЫЙ ДИПЛОМ';
            } else if (diploma_type === 'blue') {
                diplomaClass = 'diploma-blue';
                diplomaText = '🔵 СИНИЙ ДИПЛОМ';
            }
            
            let html = `
                <div class="header">
                    <div class="diploma-badge ${diplomaClass}">
                        ${diplomaText}
                    </div>
                    <div class="points">${prestige_points || 0}</div>
                    <div class="points-label">очков прокачки</div>
                </div>
            `;
            
            if (branches && branches.length > 0 && diploma_type) {
                html += `
                    <div class="tabs">
                        ${branches.map(branch => `
                            <div class="tab ${currentBranch?.id === branch.id ? 'active' : ''}" onclick="selectBranch('${branch.id}')">
                                ${branch.emoji} ${escapeHtml(branch.name)}
                            </div>
                        `).join('')}
                    </div>
                `;
                
                if (currentBranch) {
                    html += renderSkillTree(currentBranch);
                }
            } else if (!diploma_type) {
                html += `
                    <div class="tree-container" style="text-align: center; padding: 40px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">🎓</div>
                        <div style="font-weight: bold; margin-bottom: 8px;">У тебя пока нет диплома</div>
                        <div style="font-size: 13px; opacity: 0.8;">
                            Поступи в Академию Магии,<br>
                            сдай экзамены и получи диплом!
                        </div>
                    </div>
                `;
            } else if (!branches || branches.length === 0) {
                html += `
                    <div class="tree-container" style="text-align: center; padding: 40px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">🌲</div>
                        <div style="font-weight: bold; margin-bottom: 8px;">Нет доступных веток</div>
                        <div style="font-size: 13px; opacity: 0.8;">
                            Твой диплом не даёт доступа к веткам прокачки
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('app').innerHTML = html;
        }

        // ========== ОТРИСОВКА ДЕРЕВА НАВЫКОВ ==========
        function renderSkillTree(branch) {
            const levels = branch.levels || [];
            const progressPercent = (branch.current_level / branch.max_level) * 100;
            
            let statusMessage = '';
            if (!branch.is_unlocked) {
                statusMessage = '🔒 Ветка заблокирована. Получи диплом в Академии!';
            } else if (branch.current_level >= branch.max_level) {
                statusMessage = '🏆 Ветка полностью изучена!';
            } else {
                const nextLevel = branch.current_level + 1;
                const nextSkill = levels.find(l => l.level === nextLevel);
                statusMessage = nextSkill ? `📖 Нажми на "${escapeHtml(nextSkill.name)}" чтобы изучить` : '';
            }
            
            let treeHtml = `
                <div class="tree-container">
                    <div class="skill-tree">
            `;
            
            levels.forEach((level, idx) => {
                let status = 'locked';
                if (level.level <= branch.current_level) {
                    status = 'learned';
                } else if (level.level === branch.current_level + 1 && branch.is_unlocked) {
                    status = 'available';
                }
                
                treeHtml += `
                    <div class="skill-row">
                        <div class="skill-node ${status}" onclick="openSkillModal('${branch.id}', ${level.level})">
                            <div class="skill-emoji">${getStatusEmoji(status)}</div>
                            <div class="skill-name">${escapeHtml(level.name)}</div>
                            <div class="skill-desc">${escapeHtml(level.description.substring(0, 40))}${level.description.length > 40 ? '...' : ''}</div>
                            ${level.effects ? `<div class="skill-desc" style="color: #ffd700;">${formatEffectsShort(level.effects)}</div>` : ''}
                            ${status !== 'learned' ? `<div class="skill-cost">⚡ ${level.cost} очков</div>` : ''}
                        </div>
                    </div>
                `;
                if (idx < levels.length - 1) {
                    treeHtml += `<div class="connector">▼</div>`;
                }
            });
            
            treeHtml += `
                    </div>
                </div>
                
                <div class="branch-info">
                    <div class="branch-status">
                        <span>${branch.emoji} ${escapeHtml(branch.name)}</span>
                        <span>${branch.current_level}/${branch.max_level}</span>
                    </div>
                    <div class="branch-progress">
                        <div class="branch-progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                    <div class="branch-message">${statusMessage}</div>
                </div>
            `;
            
            return treeHtml;
        }

        function getStatusEmoji(status) {
            if (status === 'learned') return '⭐';
            if (status === 'available') return '🔓';
            return '🔒';
        }

        function formatEffectsShort(effects) {
            const parts = [];
            for (const [stat, value] of Object.entries(effects)) {
                if (stat === 'crit' || stat === 'dodge' || stat === 'block') {
                    parts.push(`+${Math.round(value * 100)}%`);
                } else if (stat === 'first_strike') {
                    parts.push(`x${value}`);
                } else if (value > 0) {
                    parts.push(`+${value}`);
                }
            }
            return parts.slice(0, 2).join(' | ');
        }

        function formatStatValue(stat, value) {
            if (stat === 'crit' || stat === 'dodge' || stat === 'block') {
                return `${Math.round(value * 100)}%`;
            }
            if (stat === 'first_strike') {
                return `x${value}`;
            }
            return `+${value}`;
        }

        function getStatIcon(stat) {
            const icons = { 
                power: '⚔️', hp: '❤️', mana: '💙', armor: '🛡️', 
                crit: '💥', dodge: '💨', block: '🛡️', spell_damage: '✨', 
                mana_regen: '💙', hp_regen: '❤️', first_strike: '⚡', 
                agility: '🏃', crit_damage: '💥', crit_resist: '🛡️', 
                party_armor: '👥' 
            };
            return icons[stat] || '📊';
        }

        function getStatName(stat) {
            const names = { 
                power: 'Сила', hp: 'Здоровье', mana: 'Мана', armor: 'Броня', 
                crit: 'Крит шанс', dodge: 'Уворот', block: 'Блок', 
                spell_damage: 'Урон заклинаний', mana_regen: 'Реген маны', 
                hp_regen: 'Реген HP', first_strike: 'Первый удар', 
                agility: 'Ловкость', crit_damage: 'Крит урон', 
                crit_resist: 'Защита от крита', party_armor: 'Броня отряда' 
            };
            return names[stat] || stat;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ========== МОДАЛЬНОЕ ОКНО ==========
        function openSkillModal(branchId, level) {
            const branch = currentData.branches.find(b => b.id === branchId);
            if (!branch) return;
            
            let skill = branch.levels.find(l => l.level === level);
            if (!skill) return;
            
            let status = 'locked';
            if (skill.level <= branch.current_level) {
                status = 'learned';
            } else if (skill.level === branch.current_level + 1 && branch.is_unlocked) {
                status = 'available';
            }
            
            const canLearn = status === 'available' && currentData.prestige_points >= skill.cost;
            
            const modalHtml = `
                <div class="modal-emoji">${getStatusEmoji(status)}</div>
                <div class="modal-title">${escapeHtml(skill.name)}</div>
                <div class="modal-desc">${escapeHtml(skill.description)}</div>
                
                <div class="requirement-item">
                    <span class="requirement-label">📊 Уровень героя</span>
                    <span class="requirement-value ${skill.requirements?.level_met ? 'met' : 'not-met'}">
                        ${skill.requirements?.level_current || 0}/${skill.requirements?.level_required || 1}
                    </span>
                </div>
                
                <div class="requirement-item">
                    <span class="requirement-label">🎓 Уровень ветки</span>
                    <span class="requirement-value ${skill.requirements?.branch_level_met ? 'met' : 'not-met'}">
                        ${branch.current_level}/${skill.requirements?.branch_level_required || 0}
                    </span>
                </div>
                
                <div class="requirement-item">
                    <span class="requirement-label">✨ Требуемые очки</span>
                    <span class="requirement-value ${currentData.prestige_points >= skill.cost ? 'met' : 'not-met'}">
                        ${currentData.prestige_points}/${skill.cost}
                    </span>
                </div>
                
                ${Object.keys(skill.effects || {}).length > 0 ? `
                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(210,180,140,0.2);">
                    <div style="font-size: 12px; opacity: 0.7; margin-bottom: 8px;">📜 НАГРАДА ЗА ИЗУЧЕНИЕ</div>
                    ${Object.entries(skill.effects).map(([stat, value]) => `
                        <div class="requirement-item">
                            <span class="requirement-label">${getStatIcon(stat)} ${getStatName(stat)}</span>
                            <span class="requirement-value met">${formatStatValue(stat, value)}</span>
                        </div>
                    `).join('')}
                </div>
                ` : ''}
                
                <div class="modal-buttons">
                    ${canLearn ? `<button class="btn btn-primary" onclick="learnSkill()">Изучить (${skill.cost})</button>` : 
                      status === 'learned' ? `<button class="btn btn-primary disabled" disabled>✅ Изучено</button>` :
                      `<button class="btn btn-primary disabled" disabled>🔒 Недоступно</button>`}
                    <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
                </div>
            `;
            
            selectedSkill = { branch, skill };
            document.getElementById('modalInner').innerHTML = modalHtml;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            selectedSkill = null;
        }

        // ========== ВЫБОР ВЕТКИ ==========
        function selectBranch(branchId) {
            const branch = currentData.branches.find(b => b.id === branchId);
            if (branch) {
                currentBranch = branch;
                renderApp();
            }
        }

        // ========== ИЗУЧЕНИЕ НАВЫКА ==========
        function learnSkill() {
            if (!selectedSkill) return;
            
            const { branch, skill } = selectedSkill;
            
            sendToBot('upgrade_skill', {
                branch_id: branch.id,
                level: skill.level,
                cost: skill.cost
            });
            
            closeModal();
        }

        // ========== ЗАПУСК ==========
        console.log('🚀 Mini App загружен');
        loadDataFromBot();
    </script>
</body>
</html>
