<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Test Connection</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0a0f1a;
            color: #e8dcc8;
            font-family: monospace;
            padding: 20px;
        }
        .status {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 16px;
            margin: 10px 0;
        }
        button {
            background: #4a2f8d;
            color: #ffd700;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>
    <h1>🔌 Тест связи с ботом</h1>
    
    <div class="status" id="status">
        Проверка подключения...
    </div>
    
    <button onclick="sendTest()">📤 Отправить тест боту</button>
    <button onclick="requestData()">📊 Запросить данные</button>
    
    <div id="log" class="status" style="font-size: 12px;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const userId = tg.initDataUnsafe?.user?.id || 'test';
        document.getElementById('status').innerHTML = `✅ Telegram WebApp готов<br>🆔 User ID: ${userId}`;
        
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const color = type === 'success' ? '#22c55e' : (type === 'error' ? '#ef4444' : '#3b82f6');
            logDiv.innerHTML += `<div style="color: ${color}; margin-top: 5px;">${new Date().toLocaleTimeString()}: ${message}</div>`;
        }
        
        function sendTest() {
            const testData = {
                action: 'test',
                timestamp: Date.now(),
                user_id: userId
            };
            addLog(`📤 Отправка: ${JSON.stringify(testData)}`);
            tg.sendData(JSON.stringify(testData));
        }
        
        function requestData() {
            addLog(`📤 Запрос данных: get_prestige_data`);
            tg.sendData(JSON.stringify({ action: 'get_prestige_data' }));
        }
        
        window.handleBotResponse = function(data) {
            addLog(`📥 Ответ от бота: ${JSON.stringify(data)}`, 'success');
            tg.showPopup({
                title: 'Ответ получен',
                message: JSON.stringify(data, null, 2),
                buttons: [{type: 'ok'}]
            });
        };
        
        addLog('🚀 Mini App загружен, ожидаем ответа от бота...');
    </script>
</body>
</html>
