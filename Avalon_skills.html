<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avalon Skills | Прокачка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0f1a;
            color: #e8dcc8;
            font-family: system-ui, 'Segoe UI', monospace;
            padding: 16px;
        }
        .card {
            background: rgba(30, 25, 55, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(210, 180, 140, 0.3);
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        .points {
            font-size: 40px;
            text-align: center;
            color: #ffd700;
            margin: 10px 0;
        }
        .button {
            background: #4a2f8d;
            color: #ffd700;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }
        .log {
            background: #00000055;
            border-radius: 16px;
            padding: 12px;
            font-size: 11px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }
        .log span {
            display: block;
            border-bottom: 1px solid #ffffff20;
            padding: 4px 0;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">🎓 Система прокачки</div>
    <div class="points" id="points">—</div>
    <div class="info" style="text-align:center" id="status">⏳ Загрузка данных...</div>
    <button class="button" id="loadBtn">🔄 Запросить данные</button>
    <button class="button" id="testBtn">📡 Тест связи с ботом</button>
</div>

<div class="card">
    <div class="title">📋 Лог событий</div>
    <div class="log" id="log"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function addLog(msg, type = 'info') {
        const logDiv = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        let color = '#3b82f6';
        if (type === 'success') color = '#22c55e';
        if (type === 'error') color = '#ef4444';
        logDiv.innerHTML += `<span style="color:${color}">[${time}] ${msg}</span>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function sendToBot(action, extra = {}) {
        const data = { action, ...extra };
        addLog(`📤 Отправка: ${JSON.stringify(data)}`, 'info');
        tg.sendData(JSON.stringify(data));
    }

    // Обработчик ответов от бота
    window.handleBotResponse = function(raw) {
        addLog(`📥 Ответ: ${raw.substring(0, 200)}`, 'success');
        try {
            const data = JSON.parse(raw);
            if (data.type === 'prestige_data') {
                document.getElementById('points').innerText = data.prestige_points ?? 0;
                document.getElementById('status').innerHTML = '✅ Данные загружены';
                addLog(`✅ Диплом: ${data.diploma_type}, очков: ${data.prestige_points}`, 'success');
            } else if (data.type === 'test_response') {
                addLog(`✅ Тест пройден: ${data.message}`, 'success');
            } else if (data.type === 'upgrade_success') {
                addLog(`✅ Улучшение: ${data.message}`, 'success');
            } else if (data.type === 'upgrade_error') {
                addLog(`❌ Ошибка: ${data.message}`, 'error');
            } else {
                addLog(`⚠️ Неизвестный ответ: ${raw}`, 'error');
            }
        } catch(e) {
            addLog(`❌ Ошибка парсинга: ${raw}`, 'error');
        }
    };

    // Кнопки
    document.getElementById('loadBtn').onclick = () => {
        addLog(`📡 Запрос данных get_prestige_data`, 'info');
        sendToBot('get_prestige_data');
    };
    document.getElementById('testBtn').onclick = () => {
        addLog(`📡 Тестовый запрос test`, 'info');
        sendToBot('test');
    };

    addLog(`🚀 Mini App загружен, Telegram WebApp готов`, 'success');
    addLog(`📌 Нажми "Запросить данные" для получения информации от бота`, 'info');
</script>
</body>
</html>
